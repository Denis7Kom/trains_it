name: Verify PWA
on:
  push:
    branches:
      - codex/binario-pwa
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check sw.js && node --check pwa.js && node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest'))"
      - run: npm run format && npm run baseline:record && npm run check
      - name: Commit baseline
        run: |
          rm .github/workflows/pwa-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html en/index.html it/index.html scripts/site-baseline.json .github/workflows/pwa-temp.yml
          git commit -m "Verify PWA integration"
          git push
