name: Verify train profiles
on:
  push:
    branches:
      - codex/train-side-details
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format && npm run baseline:record && npm run check
      - name: Commit formatted sources
        run: |
          rm .github/workflows/profile-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html en/index.html it/index.html scripts/site-baseline.json .github/workflows/profile-temp.yml
          git commit -m "Verify train profile updates"
          git push
