name: Test offline PWA
on:
  push:
    branches:
      - codex/binario-pwa
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright
      - name: Exercise installation cache and offline navigation
        run: |
          node --input-type=module <<'NODE'
          import http from 'node:http';
          import { readFile, stat } from 'node:fs/promises';
          import { resolve, extname, sep } from 'node:path';
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const root = process.cwd();
          const mime = {'.html':'text/html', '.js':'application/javascript', '.webmanifest':'application/manifest+json', '.png':'image/png'};
          const server = http.createServer(async (req, res) => {
            try {
              const u = new URL(req.url, 'http://localhost');
              if (!u.pathname.startsWith('/trains_it/')) throw Error('outside scope');
              let p = resolve(root, '.' + u.pathname.slice('/trains_it'.length));
              if (p !== root && !p.startsWith(root + sep)) throw Error('outside root');
              if ((await stat(p)).isDirectory()) p = resolve(p, 'index.html');
              const body = await readFile(p);
              res.writeHead(200, {'Content-Type': mime[extname(p)] || 'application/octet-stream'});
              res.end(body);
            } catch { res.writeHead(404); res.end('missing'); }
          });
          await new Promise(r => server.listen(0, '127.0.0.1', r));
          const url = 'http://127.0.0.1:' + server.address().port + '/trains_it/';
          const browser = await chromium.launch({executablePath:'/usr/bin/google-chrome', args:['--no-sandbox']});
          try {
            const context = await browser.newContext();
            const page = await context.newPage();
            await page.goto(url, {waitUntil:'load'});
            await page.evaluate(() => navigator.serviceWorker.ready);
            await page.reload({waitUntil:'load'});
            assert.equal(await page.evaluate(() => !!navigator.serviceWorker.controller), true);
            const info = await page.evaluate(async () => {
              const reg = await navigator.serviceWorker.ready;
              const cache = await caches.open('binario-pwa-v1');
              return {scope:reg.scope, pages:await Promise.all(['./','./en/','./it/'].map(x => cache.match(new URL(x, reg.scope).href).then(Boolean))),
                three:!!(await cache.match('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js'))};
            });
            assert.equal(info.scope, url);
            assert.deepEqual(info.pages, [true,true,true]);
            assert.equal(info.three, true, 'Three.js should be cached for offline viewing');
            await context.setOffline(true);
            for (const path of ['', 'en/', 'it/']) {
              await page.goto(url + path, {waitUntil:'domcontentloaded'});
              assert.match(await page.title(), /BINARIO/);
              assert.equal(await page.locator('#train-canvas').count(), 1);
            }
            console.log('PWA scope, cache, Three.js and offline RU/EN/IT navigation passed');
            await context.close();
          } finally {
            await browser.close();
            await new Promise(r => server.close(r));
          }
          NODE
      - name: Remove test workflow
        run: |
          git rm .github/workflows/pwa-test-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary PWA verification workflow"
          git push
